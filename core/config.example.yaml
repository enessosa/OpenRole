# Copy to config.yaml and adjust. config.yaml is not committed.

companies:
  - id: example
    name: Example GmbH
    source: personio
    company_id: example-gmbh

  - id: custom
    name: Custom AG
    source: html
    url: https://example.com/careers
    selectors:
      job: "li.job-item"
      title: "h3"
      location: ".job-location"
      link: "a@href"

users:
  - name: user-a
    notify: email
    email: user-a@example.com
    companies: [example, custom]
    filters:
      title_any: ["Werkstudent", "Working Student"]
      title_also_any: ["Data", "Software", "Python"]
      location_any: ["München", "Munich"]
