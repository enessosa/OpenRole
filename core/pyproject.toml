[project]
name = "openrole"
version = "0.1.0"
description = "Get notified when the companies you care about post a role that fits you."
readme = "README.md"
authors = [
    { name = "Enes Sadi" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.29.1",
]

[project.scripts]
openrole = "openrole.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
